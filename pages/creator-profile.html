<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LOOKPULSE - 크리에이터 프로필 및 협찬 룩북 모아보기">
  <title>크리에이터 프로필 | LOOKPULSE</title>

  <style>
    :root {
      --color-primary: #8B6F9E;
      --color-primary-light: #F4EFF7;
      --color-primary-dark: #5C436E;
      --color-primary-rgb: 139, 111, 158;
      --color-background: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-border: #EAEAEA;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-accent-gold: #C5A059;
      --color-accent-gold-bg: #FDF9F0;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-base); background-color: var(--color-background); color: var(--color-text-primary); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    img { max-width: 100%; display: block; }

    .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; }
    .logo__icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 16px; }

    /* Profile Header Box */
    .profile-card {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 36px;
      margin: 36px 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      box-shadow: var(--shadow-sm);
    }

    .profile-info { display: flex; align-items: center; gap: 24px; }
    .profile-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--color-primary); }

    .creator-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--color-accent-gold-bg);
      color: var(--color-accent-gold);
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .profile-name { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .profile-bio { font-size: 14px; color: var(--color-text-secondary); max-width: 480px; margin-bottom: 12px; }

    .stats-row { display: flex; gap: 20px; font-size: 14px; color: var(--color-text-primary); }
    .stats-num { font-weight: 800; }

    .btn-profile-follow {
      padding: 10px 24px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: #FFF;
      font-size: 14px;
      font-weight: 700;
      transition: var(--transition);
    }
    .btn-profile-follow:hover { background: var(--color-primary-dark); }
    .btn-profile-follow--active { background: var(--color-primary-light); color: var(--color-primary-dark); border: 1px solid var(--color-primary); }

    /* Tabs & Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
      padding-bottom: 12px;
    }

    .tabs-group { display: flex; gap: 20px; }
    .tab-item {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-secondary);
      padding-bottom: 8px;
      position: relative;
    }
    .tab-item--active { color: var(--color-primary-dark); }
    .tab-item--active::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--color-primary);
      border-radius: 3px;
    }

    /* Outfits Grid */
    .outfits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 80px;
    }

    .outfit-thumb {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      transition: var(--transition);
    }
    .outfit-thumb:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

    .outfit-thumb__img-wrap { width: 100%; padding-top: 133%; position: relative; }
    .outfit-thumb__img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
    .outfit-thumb__badge { position: absolute; top: 10px; left: 10px; background: var(--color-accent-gold); color: #FFF; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; z-index: 10; }
    .outfit-thumb__title { padding: 12px; font-size: 13px; font-weight: 700; }

    @media (max-width: 768px) {
      .profile-card { flex-direction: column; align-items: flex-start; padding: 24px; }
      .profile-info { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="logo">
        <span class="logo__icon">✦</span>
        <span>LOOKPULSE</span>
      </a>
      <a href="../index.html" style="font-size:14px; font-weight:600; color:var(--color-primary);">홈으로 돌아가기</a>
    </div>
  </header>

  <main class="container">
    <!-- Profile Card Header -->
    <section class="profile-card">
      <div class="profile-info">
        <img src="" alt="" class="profile-avatar" id="avatarImg" />
        <div>
          <div class="creator-badge" id="badgeTag">✨ 파트너 크리에이터</div>
          <h1 class="profile-name" id="profileName"></h1>
          <p class="profile-bio" id="profileBio"></p>
          <div class="stats-row">
            <span>게시물 <span class="stats-num" id="statPosts">0</span></span>
            <span>팔로워 <span class="stats-num" id="statFollowers">0</span></span>
            <span>총 좋아요 <span class="stats-num" id="statLikes">0</span></span>
          </div>
        </div>
      </div>
      <button type="button" class="btn-profile-follow" id="followBtn">+ 팔로우</button>
    </section>

    <!-- Tabs & Filter Bar -->
    <section class="filter-bar">
      <div class="tabs-group">
        <button class="tab-item tab-item--active" data-filter="all">전체 코디 (<span id="allCount">0</span>)</button>
        <button class="tab-item" data-filter="sponsored">브랜드 협찬 룩 🏷️ (<span id="sponsorCount">0</span>)</button>
      </div>
      <span style="font-size:13px; color:var(--color-text-tertiary);">최신순 정렬</span>
    </section>

    <!-- Creator Outfits Grid -->
    <section class="outfits-grid" id="creatorGrid">
      <!-- Injected via JavaScript -->
    </section>
  </main>

  <script src="../scripts/main.js"></script>
  <script src="../scripts/community.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const [creators, outfits] = await Promise.all([
        LOOKPULSE.fetchData('creators.json') || [],
        LOOKPULSE.fetchData('outfits.json') || []
      ]);

      const params = new URLSearchParams(window.location.search);
      const creatorId = params.get('id') || 'creator-1';
      const creator = creators.find(c => c.id === creatorId) || creators[0];

      if (!creator) return;

      // Populate Header
      document.getElementById('avatarImg').src = creator.avatar;
      document.getElementById('profileName').textContent = creator.name;
      document.getElementById('profileBio').textContent = creator.bio;
      document.getElementById('badgeTag').textContent = `✨ ${creator.badge}`;
      document.getElementById('statPosts').textContent = creator.postsCount;
      document.getElementById('statFollowers').textContent = (creator.followers).toLocaleString();
      document.getElementById('statLikes').textContent = (creator.totalLikes).toLocaleString();

      // Follow Action
      const followBtn = document.getElementById('followBtn');
      const followings = LPCommunity.getFollowings();
      if (followings.includes(creator.id)) {
        followBtn.classList.add('btn-profile-follow--active');
        followBtn.textContent = '✓ 팔로잉';
      }
      followBtn.addEventListener('click', () => {
        LPCommunity.toggleFollow(creator.id, followBtn);
      });

      // Filter Creator's Outfits
      const creatorOutfits = outfits.filter(o => o.creatorId === creator.id);
      const sponsoredOutfits = creatorOutfits.filter(o => o.isSponsored);

      document.getElementById('allCount').textContent = creatorOutfits.length;
      document.getElementById('sponsorCount').textContent = sponsoredOutfits.length;

      const grid = document.getElementById('creatorGrid');

      function renderList(list) {
        if (list.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 0; color:var(--color-text-tertiary);">게시물이 없습니다.</div>`;
          return;
        }
        grid.innerHTML = list.map(o => `
          <article class="outfit-thumb">
            <div class="outfit-thumb__img-wrap">
              <a href="outfit-detail.html?id=${o.id}">
                <img src="${o.imageUrl}" alt="${o.title}" class="outfit-thumb__img" />
              </a>
              ${o.isSponsored ? '<span class="outfit-thumb__badge">협찬 AD</span>' : ''}
            </div>
            <h3 class="outfit-thumb__title"><a href="outfit-detail.html?id=${o.id}">${o.title}</a></h3>
          </article>
        `).join('');
      }

      renderList(creatorOutfits);

      // Tab handlers
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('tab-item--active'));
          tab.classList.add('tab-item--active');
          const filter = tab.dataset.filter;
          renderList(filter === 'sponsored' ? sponsoredOutfits : creatorOutfits);
        });
      });
    });
  </script>
</body>
</html>
