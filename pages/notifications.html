<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 센터 | LOOKPULSE</title>
  <style>
    :root {
      --color-primary: #8B6F9E;
      --color-primary-light: #F4EFF7;
      --color-background: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-border: #EAEAEA;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #666666;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      --radius-md: 14px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-base); background: var(--color-background); color: var(--color-text-primary); }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    .header { position: sticky; top: 0; background: rgba(255,255,255,0.94); border-bottom: 1px solid var(--color-border); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .page-head { padding: 36px 0 20px; }
    .notif-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 60px; }
    .notif-card {
      background: #FFF; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .notif-card--unread { border-left: 4px solid var(--color-primary); background: #FCFAFD; }
    .notif-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--color-primary-light); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .notif-body { flex: 1; }
    .notif-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .notif-time { font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" style="font-size:22px; font-weight:800; display:flex; gap:8px;"><span>✦</span><span>LOOKPULSE</span></a>
      <a href="../index.html" style="font-size:14px; color:var(--color-primary); font-weight:600;">홈으로</a>
    </div>
  </header>
  <main class="container">
    <div class="page-head">
      <h1 style="font-size:24px; font-weight:800;">활동 알림 🔔</h1>
    </div>
    <div class="notif-list">
      <div class="notif-card notif-card--unread">
        <div class="notif-icon">🎁</div>
        <div class="notif-body">
          <div class="notif-title"><strong>무드스튜디오</strong> 브랜드로부터 2026 FW 자켓 협찬 제안이 도착했습니다!</div>
          <div class="notif-time">10분 전</div>
        </div>
      </div>
      <div class="notif-card notif-card--unread">
        <div class="notif-icon">❤️</div>
        <div class="notif-body">
          <div class="notif-title"><strong>이지은</strong> 님이 회원님의 가을 레더자켓 코디를 좋아합니다.</div>
          <div class="notif-time">1시간 전</div>
        </div>
      </div>
      <div class="notif-card">
        <div class="notif-icon">👤</div>
        <div class="notif-body">
          <div class="notif-title"><strong>한소라</strong> 님이 회원님을 팔로우하기 시작했습니다.</div>
          <div class="notif-time">어제</div>
        </div>
      </div>
    </div>
  </main>
  <script src="../scripts/main.js"></script>
</body>
</html>
