<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 및 회원가입 | LOOKPULSE</title>
  <style>
    :root {
      --color-primary: #8B6F9E;
      --color-primary-dark: #5C436E;
      --color-background: #FAFAFA;
      --color-border: #EAEAEA;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      --radius-md: 14px;
      --radius-full: 9999px;
      --shadow-sm: 0 4px 16px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-base); background: var(--color-background); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    .auth-card { background: #FFF; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-sm); text-align: center; }
    .auth-logo { font-size: 26px; font-weight: 800; color: var(--color-primary-dark); margin-bottom: 8px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: 8px; font-size: 14px; outline: none; }
    .btn-auth { width: 100%; padding: 12px; background: var(--color-primary); color: #FFF; border: none; border-radius: var(--radius-full); font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">✦ LOOKPULSE</div>
    <p style="font-size:14px; color:#666; margin-bottom:28px;">3초 만에 시작하는 패션 소셜 커뮤니티</p>
    <form onsubmit="event.preventDefault(); LOOKPULSE.showToast('로그인되었습니다!', 'success'); setTimeout(() => window.location.href='../index.html', 1000);">
      <div class="form-group">
        <label>이메일 주소</label>
        <input type="email" value="user@lookpulse.com" required />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" value="********" required />
      </div>
      <button type="submit" class="btn-auth">로그인 / 간편시작</button>
    </form>
    <div style="margin-top:20px; font-size:13px; color:#888;">
      <a href="../index.html">홈으로 바로 둘러보기 →</a>
    </div>
  </div>
  <script src="../scripts/main.js"></script>
</body>
</html>
