<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LOOKPULSE - 내 코디 사진 업로드 및 착장 상품 핀 마킹">
  <title>코디 올리기 | LOOKPULSE</title>

  <style>
    :root {
      --color-primary: #8B6F9E;
      --color-primary-light: #F4EFF7;
      --color-primary-dark: #5C436E;
      --color-background: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-border: #EAEAEA;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-accent-gold: #C5A059;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-base); background-color: var(--color-background); color: var(--color-text-primary); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    img { max-width: 100%; display: block; }

    .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; }
    .logo__icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 16px; }

    /* Upload Form Layout */
    .upload-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      padding: 40px 0 80px;
    }

    /* Left: Canvas & Dropzone */
    .dropzone-box {
      background: #FFF;
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: var(--transition);
    }
    .dropzone-box:hover { border-color: var(--color-primary); }

    .preview-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      background: #000;
      cursor: crosshair;
    }

    .preview-canvas img { width: 100%; height: 100%; object-fit: contain; }

    .pin-marker {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--color-primary);
      border: 2px solid #FFF;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 11px;
      font-weight: 800;
    }

    /* Right: Metadata Form */
    .form-card {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-title { font-size: 22px; font-weight: 800; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
    
    .form-input, .form-textarea, .form-select {
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--color-primary); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: var(--color-background);
      border-radius: var(--radius-sm);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #CCC; transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--color-accent-gold); }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-submit {
      padding: 14px;
      background: var(--color-primary);
      color: #FFF;
      font-size: 16px;
      font-weight: 700;
      border-radius: var(--radius-full);
      margin-top: 10px;
      transition: var(--transition);
    }
    .btn-submit:hover { background: var(--color-primary-dark); }

    @media (max-width: 800px) {
      .upload-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="logo">
        <span class="logo__icon">✦</span>
        <span>LOOKPULSE</span>
      </a>
      <a href="../index.html" style="font-size:14px; font-weight:600; color:var(--color-primary);">나가기</a>
    </div>
  </header>

  <main class="container">
    <form class="upload-layout" id="uploadForm">
      <!-- Left: Interactive Pinning Canvas -->
      <div>
        <div class="dropzone-box" id="dropzone">
          <div id="dropzonePrompt" style="text-align:center;">
            <div style="font-size:44px; margin-bottom:12px;">📸</div>
            <h3 style="font-size:16px; font-weight:700; margin-bottom:6px;">코디 사진을 등록해주세요</h3>
            <p style="font-size:13px; color:var(--color-text-secondary); margin-bottom:16px;">클릭하여 기본 샘플 사진을 로드하거나 마킹을 시작하세요.</p>
            <button type="button" class="btn-submit" style="padding:8px 18px; font-size:13px;" id="sampleBtn">샘플 사진 불러오기</button>
          </div>
          <div class="preview-canvas" id="previewCanvas">
            <img src="" id="canvasImg" alt="Preview" />
          </div>
        </div>
        <p style="font-size:12px; color:var(--color-text-tertiary); margin-top:10px; text-align:center;">
          * 사진 위 착장 아이템(상의, 하의 등) 위치를 클릭하면 상품 태그 핀이 생성됩니다.
        </p>
      </div>

      <!-- Right: Form Data -->
      <div class="form-card">
        <h1 class="form-title">코디 정보 입력</h1>

        <div class="form-group">
          <label class="form-label">코디 제목</label>
          <input type="text" class="form-input" id="titleInput" placeholder="예: 가을 무드 빈티지 가죽 자켓 코디" required />
        </div>

        <div class="form-group">
          <label class="form-label">스타일 설명</label>
          <textarea class="form-textarea" id="descInput" rows="3" placeholder="어떤 분위기의 룩인지, 착용감이나 팁을 공유해보세요."></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">계절 (Season)</label>
            <select class="form-select" id="seasonSelect">
              <option value="autumn">가을 (Autumn)</option>
              <option value="spring">봄 (Spring)</option>
              <option value="summer">여름 (Summer)</option>
              <option value="winter">겨울 (Winter)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">장소 (Place)</label>
            <select class="form-select" id="placeSelect">
              <option value="cafe">카페 투어</option>
              <option value="office">오피스 출근</option>
              <option value="date">데이트 명소</option>
              <option value="travel">여행/바캉스</option>
            </select>
          </div>
        </div>

        <!-- Sponsorship Toggle -->
        <div class="toggle-row">
          <div>
            <div style="font-size:14px; font-weight:700;">브랜드 협찬 여부</div>
            <div style="font-size:12px; color:var(--color-text-secondary);">브랜드 제품 지원이나 원고료를 받은 경우 체크</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="sponsorToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-group" id="sponsorField" style="display:none;">
          <label class="form-label">협찬 브랜드명</label>
          <input type="text" class="form-input" id="sponsorBrandInput" placeholder="예: 무드스튜디오" />
        </div>

        <div class="form-group">
          <label class="form-label">태그 (쉼표로 구분)</label>
          <input type="text" class="form-input" id="tagInput" placeholder="가을코디, 레더자켓, 데일리룩" />
        </div>

        <button type="submit" class="btn-submit">게시하기</button>
      </div>
    </form>
  </main>

  <script src="../scripts/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropzonePrompt = document.getElementById('dropzonePrompt');
      const previewCanvas = document.getElementById('previewCanvas');
      const canvasImg = document.getElementById('canvasImg');
      const sampleBtn = document.getElementById('sampleBtn');
      const sponsorToggle = document.getElementById('sponsorToggle');
      const sponsorField = document.getElementById('sponsorField');

      let pinCount = 0;

      // Sample image loader
      sampleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        loadImage('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=80');
      });

      function loadImage(url) {
        canvasImg.src = url;
        dropzonePrompt.style.display = 'none';
        previewCanvas.style.display = 'block';
        LOOKPULSE.showToast('사진이 로드되었습니다. 옷 위치를 클릭해 핀을 달아보세요!', 'info');
      }

      // Pin Marking on Preview Canvas
      previewCanvas.addEventListener('click', (e) => {
        const rect = previewCanvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;

        pinCount++;
        const pin = document.createElement('div');
        pin.className = 'pin-marker';
        pin.style.left = `${x}%`;
        pin.style.top = `${y}%`;
        pin.textContent = pinCount;
        previewCanvas.appendChild(pin);

        LOOKPULSE.showToast(`상품 핀 #${pinCount} 위치가 지정되었습니다.`, 'success');
      });

      // Sponsor Toggle change
      sponsorToggle.addEventListener('change', () => {
        sponsorField.style.display = sponsorToggle.checked ? 'flex' : 'none';
      });

      // Submit Form
      document.getElementById('uploadForm').addEventListener('submit', (e) => {
        e.preventDefault();
        LOOKPULSE.showToast('코디가 성공적으로 등록되었습니다!', 'success');
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
