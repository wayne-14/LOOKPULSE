<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LOOKPULSE - 계절별, 장소별, 상황별 TPO 코디 탐색">
  <meta name="theme-color" content="#8B6F9E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LOOKPULSE">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/app-icon.svg">
  <title>탐색 | LOOKPULSE 스타일 큐레이션</title>

  <style>
    :root {
      --color-primary: #8B6F9E;
      --color-primary-light: #F4EFF7;
      --color-primary-dark: #5C436E;
      --color-primary-rgb: 139, 111, 158;
      --color-background: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-border: #EAEAEA;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-accent-gold: #C5A059;
      --color-like: #FF3B30;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-base); background-color: var(--color-background); color: var(--color-text-primary); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    img { max-width: 100%; display: block; }

    .container { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    .header { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 24px; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; }
    .logo__icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 16px; }
    .nav { display: flex; align-items: center; gap: 28px; }
    .nav__link { font-size: 15px; font-weight: 600; color: var(--color-text-secondary); transition: var(--transition); padding: 6px 0; }
    .nav__link:hover, .nav__link--active { color: var(--color-primary-dark); }
    .nav__link--active { border-bottom: 2px solid var(--color-primary); }

    /* Explore Banner & Filters */
    .explore-head { padding: 32px 0 20px; }
    .explore-head__title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .explore-head__desc { font-size: 15px; color: var(--color-text-secondary); }

    .filter-section {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group__label {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-tertiary);
      min-width: 60px;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--color-background);
      border: 1px solid var(--color-border);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      transition: var(--transition);
    }

    .chip-btn:hover, .chip-btn--active {
      background: var(--color-primary);
      color: #FFF;
      border-color: var(--color-primary);
    }

    /* Outfits Grid */
    .outfits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding-bottom: 60px;
    }

    .outfit-card {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .outfit-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .outfit-card__image-wrap {
      position: relative;
      width: 100%;
      padding-top: 133%;
      overflow: hidden;
      background: #F0F0F0;
    }

    .outfit-card__img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .outfit-card:hover .outfit-card__img { transform: scale(1.03); }

    .badge--sponsored {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--color-accent-gold);
      color: #FFF;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .outfit-card__body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .outfit-card__title { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .outfit-card__tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .outfit-card__tag { font-size: 12px; color: var(--color-text-secondary); }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #FFF;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
    }
    .empty-state__icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state__title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .empty-state__desc { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 16px; }

    /* Mobile Bottom Navigation Bar */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--color-border);
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
    }

    .tab-bar__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-tertiary);
      text-decoration: none;
      flex: 1;
      padding: 6px 0;
      transition: var(--transition);
    }

    .tab-bar__item--active, .tab-bar__item:hover {
      color: var(--color-primary-dark);
    }

    .tab-bar__item-upload {
      margin-top: -16px;
    }

    .tab-bar__upload-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.4);
      border: 3px solid #FFF;
    }

    @media (max-width: 768px) {
      body { padding-bottom: 70px; }
      .nav, .header__inner > div:last-child { display: none; }
      .mobile-tab-bar { display: flex; }
      .filter-group { flex-direction: column; align-items: flex-start; }
      .outfits-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="logo">
        <span class="logo__icon">✦</span>
        <span>LOOKPULSE</span>
      </a>
      <nav class="nav">
        <a href="../index.html" class="nav__link">홈</a>
        <a href="explore.html" class="nav__link nav__link--active">탐색</a>
        <a href="saved.html" class="nav__link">저장함</a>
        <a href="notifications.html" class="nav__link">알림</a>
      </nav>
      <div>
        <a href="upload.html" class="chip-btn chip-btn--active">+ 코디 올리기</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="explore-head">
      <h1 class="explore-head__title">상황별 코디 탐색 (TPO 큐레이션)</h1>
      <p class="explore-head__desc">어디로 가시나요? 계절과 장소, 목적에 꼭 맞는 스타일을 발견해보세요.</p>
    </section>

    <!-- Multi-Filter Matrix -->
    <section class="filter-section">
      <div class="filter-group">
        <span class="filter-group__label">계절 (Season)</span>
        <div class="filter-chips" id="seasonFilters">
          <button class="chip-btn chip-btn--active" data-season="all">전체</button>
          <button class="chip-btn" data-season="spring">🌸 봄 (Spring)</button>
          <button class="chip-btn" data-season="summer">☀️ 여름 (Summer)</button>
          <button class="chip-btn" data-season="autumn">🍂 가을 (Autumn)</button>
          <button class="chip-btn" data-season="winter">❄️ 겨울 (Winter)</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-group__label">장소 (Place)</span>
        <div class="filter-chips" id="placeFilters">
          <button class="chip-btn chip-btn--active" data-place="all">전체</button>
          <button class="chip-btn" data-place="cafe">☕ 성수/한남 카페</button>
          <button class="chip-btn" data-place="office">💼 오피스/출근</button>
          <button class="chip-btn" data-place="date">💖 데이트 명소</button>
          <button class="chip-btn" data-place="travel">✈️ 여행/휴양지</button>
          <button class="chip-btn" data-place="wedding">🤵 결혼식장</button>
        </div>
      </div>
    </section>

    <!-- Filtered Outfit Results -->
    <section class="outfits-grid" id="exploreGrid">
      <!-- Injected via JavaScript -->
    </section>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION BAR (PWA) -->
  <nav class="mobile-tab-bar" aria-label="모바일 내비게이션">
    <a href="../index.html" class="tab-bar__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>홈</span>
    </a>
    <a href="explore.html" class="tab-bar__item tab-bar__item--active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span>탐색</span>
    </a>
    <a href="upload.html" class="tab-bar__item tab-bar__item-upload">
      <div class="tab-bar__upload-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>올리기</span>
    </a>
    <a href="saved.html" class="tab-bar__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>저장함</span>
    </a>
    <a href="user-profile.html" class="tab-bar__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>마이룩</span>
    </a>
  </nav>

  <script src="../scripts/main.js"></script>
  <script src="../scripts/community.js"></script>
  <script src="../scripts/pwa.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let outfits = await LOOKPULSE.fetchData('outfits.json') || [];
      const grid = document.getElementById('exploreGrid');

      // Parse initial URL query params
      const params = new URLSearchParams(window.location.search);
      let activeSeason = params.get('season') || 'all';
      let activePlace = params.get('place') || 'all';

      // Update button active classes based on initial state
      updateFilterButtons();

      function updateFilterButtons() {
        document.querySelectorAll('#seasonFilters .chip-btn').forEach(btn => {
          btn.classList.toggle('chip-btn--active', btn.dataset.season === activeSeason);
        });
        document.querySelectorAll('#placeFilters .chip-btn').forEach(btn => {
          btn.classList.toggle('chip-btn--active', btn.dataset.place === activePlace);
        });
      }

      function renderOutfits() {
        const filtered = outfits.filter(o => {
          const matchSeason = activeSeason === 'all' || o.season === activeSeason;
          const matchPlace = activePlace === 'all' || o.place === activePlace;
          return matchSeason && matchPlace;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">🔍</div>
              <h3 class="empty-state__title">선택한 조건의 코디가 아직 없어요</h3>
              <p class="empty-state__desc">다른 계절이나 장소를 선택하거나, 첫 번째 코디의 주인공이 되어보세요!</p>
              <button class="chip-btn chip-btn--active" onclick="resetFilters()">전체 필터 초기화</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered.map(o => `
          <article class="outfit-card">
            <div class="outfit-card__image-wrap">
              <a href="outfit-detail.html?id=${o.id}">
                <img src="${o.imageUrl}" alt="${o.title}" class="outfit-card__img" loading="lazy" />
              </a>
              ${o.isSponsored ? '<span class="badge--sponsored">협찬 AD</span>' : ''}
            </div>
            <div class="outfit-card__body">
              <h3 class="outfit-card__title">
                <a href="outfit-detail.html?id=${o.id}">${o.title}</a>
              </h3>
              <div class="outfit-card__tags">
                ${o.tags.map(t => `<span class="outfit-card__tag">#${t}</span>`).join('')}
              </div>
              <div style="margin-top: auto; font-size: 13px; color: var(--color-text-secondary); display:flex; justify-content:space-between;">
                <span>❤️ ${o.likes}</span>
                <span>🔖 ${o.saves}</span>
              </div>
            </div>
          </article>
        `).join('');
      }

      // Filter Click Handlers
      document.getElementById('seasonFilters').addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        activeSeason = btn.dataset.season;
        updateFilterButtons();
        renderOutfits();
      });

      document.getElementById('placeFilters').addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        activePlace = btn.dataset.place;
        updateFilterButtons();
        renderOutfits();
      });

      window.resetFilters = () => {
        activeSeason = 'all';
        activePlace = 'all';
        updateFilterButtons();
        renderOutfits();
      };

      // Initial Render
      renderOutfits();
    });
  </script>
</body>
</html>
